<style>
  :root {
    --bg: #F2F2F7;
    --card: #FFFFFF;
    --label: #000000;
    --label2: rgba(60,60,67,.6);
    --label3: rgba(60,60,67,.3);
    --sep: rgba(60,60,67,.18);
    --fill: rgba(118,118,128,.12);
    --fill-press: rgba(118,118,128,.26);
    /* Glas-Knöpfe hell: weiß, feiner grauer Ring, leichter Schatten (wie iOS) */
    /* wie im Bild: klares Glas, dunkler Haarlinien-Rand (seitlich kräftiger), oben und unten innen ein weißer Lichtsaum */
    --btn-glass: rgba(255,255,255,.18);
    --rim-gray: inset 0 7px 6px -4px rgba(255,255,255,1), inset 0 -7px 6px -4px rgba(255,255,255,.95), inset 0 0 0 1px rgba(0,0,0,.24), 0 1px 2px rgba(0,0,0,.04);
    --rim-color: inset 0 0 0 1px rgba(0,0,0,.08), inset 0 1.5px 3px rgba(255,255,255,.35), 0 1px 4px rgba(0,0,0,.08);
    --press-tint: rgba(0,0,0,.06);
    --blue: #007AFF;
    --red: #FF3B30;
    --green: #34C759;
    --orange: #FF9500;
    --bar: rgba(249,249,249,.82);
    --dockbg: rgba(242,242,247,.86);
    --tally: #1C1C1E;
    --sheet: #FFFFFF;
    --sheet-glass: rgba(255,255,255,.62);
    --dim: rgba(0,0,0,.35);
  }
  :root[data-theme="dark"] {
      --bg: #000000;
      --card: #1C1C1E;
      --label: #FFFFFF;
      --label2: rgba(235,235,245,.6);
      --label3: rgba(235,235,245,.3);
      --sep: rgba(84,84,88,.6);
      --fill: rgba(118,118,128,.24);
      --fill-press: rgba(150,150,160,.5);
      --btn-glass: var(--fill);
      --rim-gray: inset 0 0 0 .5px rgba(255,255,255,.07), inset 0 1.5px 3px rgba(255,255,255,.16), inset 0 0 7px rgba(255,255,255,.06);
      --rim-color: inset 0 0 0 .5px rgba(255,255,255,.12), inset 0 1.5px 3px rgba(255,255,255,.28), inset 0 0 7px rgba(255,255,255,.1);
      --press-tint: rgba(255,255,255,.13);
      --blue: #0A84FF;
      --red: #FF453A;
      --green: #30D158;
      --orange: #FF9F0A;
      --bar: rgba(22,22,24,.82);
    --dockbg: rgba(0,0,0,.82);
      --tally: #F2F2F7;
      --sheet: #2C2C2E;
      --sheet-glass: rgba(40,40,42,.64);
      --dim: rgba(0,0,0,.55);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000;
      --card: #1C1C1E;
      --label: #FFFFFF;
      --label2: rgba(235,235,245,.6);
      --label3: rgba(235,235,245,.3);
      --sep: rgba(84,84,88,.6);
      --fill: rgba(118,118,128,.24);
      --fill-press: rgba(150,150,160,.5);
      --btn-glass: var(--fill);
      --rim-gray: inset 0 0 0 .5px rgba(255,255,255,.07), inset 0 1.5px 3px rgba(255,255,255,.16), inset 0 0 7px rgba(255,255,255,.06);
      --rim-color: inset 0 0 0 .5px rgba(255,255,255,.12), inset 0 1.5px 3px rgba(255,255,255,.28), inset 0 0 7px rgba(255,255,255,.1);
      --press-tint: rgba(255,255,255,.13);
      --blue: #0A84FF;
      --red: #FF453A;
      --green: #30D158;
      --orange: #FF9F0A;
      --bar: rgba(22,22,24,.82);
    --dockbg: rgba(0,0,0,.82);
      --tally: #F2F2F7;
      --sheet: #2C2C2E;
      --sheet-glass: rgba(40,40,42,.64);
      --dim: rgba(0,0,0,.55);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  /* Fläche hinter der Statusleiste folgt dem Design (hell = weißlich, dunkel = schwarz) */
  html { background: var(--bg); color-scheme: light dark; }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  body {
    background: var(--bg);
    color: var(--label);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior-y: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }

  .app {
    max-width: 560px; margin: 0 auto;
    height: var(--app-h, 100%); overflow: hidden;
    padding: calc(env(safe-area-inset-top) + 8px) 16px 0;
    display: flex; flex-direction: column;
  }

  /* Header */
  header { flex: none; display: flex; align-items: flex-end; justify-content: space-between; padding: 8px 4px 0; }
  h1 { font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: .37px; margin: 0; }
  .more {
    width: 54px; height: 54px; border-radius: 50%; background: var(--blue);
    display: grid; place-items: center; margin-bottom: 0; color: #fff;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .32s var(--bounce);
  }
  .more:active { transform: scale(.88); transition-duration: .08s; }
  .hbtns { display: flex; align-items: center; gap: 12px; }
  .gear {
    width: 54px; height: 54px; border-radius: 50%; background: var(--fill); color: var(--label);
    display: grid; place-items: center; transition: transform .32s var(--bounce), background .3s;
  }
  .gear:active { transform: scale(.88); transition-duration: .08s; }
  .gear svg { width: 26px; height: 26px; }
  /* Abrechnen */
  .pay-list { max-height: 52vh; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  .pay-item + .pay-item { background-image: linear-gradient(var(--sep), var(--sep)); background-repeat: no-repeat; background-position: 16px 0; background-size: calc(100% - 32px) .5px; }
  .pay-item .row { background-image: none; }
  .pay-row .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; margin: 0 2px 0 4px; }
  .pay-row .pay-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pay-row .row-val { margin-left: 0; }
  .pay-row .chev { width: 14px; height: 14px; color: var(--label3); flex: none; transition: transform .35s var(--spring); }
  .pay-item.open .chev { transform: rotate(90deg); }
  .pay-exp { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .38s var(--spring); }
  .pay-item.open .pay-exp { grid-template-rows: 1fr; }
  .pay-inner { overflow: hidden; min-height: 0; }
  .pay-form { display: flex; gap: 10px; padding: 2px 14px 4px; }
  .pay-field {
    flex: 1; min-width: 0; display: flex; align-items: center; height: 48px; padding: 0 16px;
    border-radius: 24px; background: var(--sheet);
  }
  .pay-field input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--label);
    font: inherit; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums;
    -webkit-user-select: text; user-select: text;
  }
  .pay-field input::placeholder { color: var(--label3); font-weight: 500; }
  .pay-field span { font-size: 20px; font-weight: 600; color: var(--label2); }
  .pay-go {
    flex: none; height: 48px; padding: 0 20px; border-radius: 24px; background: var(--blue); color: #fff;
    font-size: 17px; font-weight: 600; transition: transform .3s var(--bounce), opacity .2s;
  }
  .pay-go:active { transform: scale(.95); transition-duration: .07s; }
  .pay-go.off { opacity: .35; }
  .pay-go { display: inline-flex; align-items: center; justify-content: center; position: relative; cursor: pointer; -webkit-user-select: none; user-select: none; }
  .pay-hint { margin: 8px 18px 14px; font-size: 13px; line-height: 1.4; color: var(--label2); }
  .pay-hint.err { color: var(--red); }
  /* Beim Tippen: andere Tabs und Texte weich zusammenklappen */
  #paySheet .pay-item { max-height: 54px; overflow: hidden; transition: max-height .45s var(--spring), opacity .3s ease, border-color .3s ease; }
  #paySheet .pay-item.open { max-height: 210px; }
  #paySheet .section-label, #paySheet .hint { max-height: 90px; overflow: hidden; transition: max-height .45s var(--spring), opacity .3s ease, margin .45s var(--spring); }
  #paySheet.typing .pay-item:not(.open) { max-height: 0; opacity: 0; background-image: none; }
  #paySheet.typing .pay-item.open { background-image: none; }
  #paySheet.typing .section-label, #paySheet.typing .hint { max-height: 0; opacity: 0; margin-top: 0; margin-bottom: 0; }
  /* Wie iOS: erst die ersten 4 Tabs, groß ziehen zeigt den Rest (dann scrollbar) */
  #paySheet .pay-list { max-height: var(--list-h, 52vh); overflow-y: hidden; transition: max-height .5s var(--spring); }
  #paySheet.expanded .pay-list { overflow-y: auto; }
  #paySheet.dragging .pay-list { transition: none; }
  #paySheet.typing .pay-list { max-height: 400px; }
  /* Hinweis, dass man das Pop-up ziehen kann: Griff oben + nächster Tab schaut unten angeschnitten raus */
  #paySheet .grabber { position: absolute; top: 7px; left: 50%; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px;
    background: var(--label3); opacity: 0; transition: opacity .3s ease; pointer-events: none; }
  #paySheet.can-grow .grabber { opacity: 1; }
  /* angeschnittener 5. Tab nur blasser (keine Maske – die hat beim Hochfahren auf dem iPhone geruckelt) */
  #paySheet.can-grow:not(.expanded):not(.typing) .pay-item:nth-child(n+5) { opacity: .4; }
  #paySheet.nosize .pay-list { transition: none !important; }
  .row-val.flash { animation: flash .6s ease; }
  @keyframes flash { 30% { color: var(--green); transform: scale(1.08); } }
  .row-val { display: inline-block; }
  .section-label { font-size: 13px; color: var(--label2); text-transform: uppercase; letter-spacing: .3px; margin: 2px 6px 8px; }
  .row .check { margin-left: auto; width: 20px; height: 20px; color: var(--blue); visibility: hidden; }
  .row.sel .check { visibility: visible; }
  .more svg { width: 29px; height: 29px; }
  /* #98: die drei Knöpfe oben etwas kleiner (54 → 48, Symbole mit verkleinert) */
  header .gear, header .more { width: 48px; height: 48px; }
  header .gear svg { width: 23px; height: 23px; }
  header .more svg { width: 26px; height: 26px; }

  /* Tabs */
  .tabs {
    display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden; margin: -4px -16px -12px; padding: 18px 16px 14px; /* Luft für Drücken/Anheben, Abstände bleiben gleich */
    scroll-padding-inline: 16px; scrollbar-width: none;
    flex: none; touch-action: pan-x; overscroll-behavior: contain; position: relative;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; height: 34px; padding: 0 16px; border-radius: 17px;
    background: var(--fill); color: var(--label);
    font-size: 15px; font-weight: 500; white-space: nowrap;
    max-width: 180px; overflow: hidden; text-overflow: ellipsis;
    transition: background .3s ease, color .3s ease, transform .3s var(--bounce);
  }
  .chip:active { transform: scale(.94); transition-duration: .08s; }
  .chip.active { background: var(--accent); color: var(--on-accent); }
  .chip.add { width: 34px; padding: 0; display: grid; place-items: center; color: var(--blue); }
  .chip.add svg { width: 16px; height: 16px; }

  /* Card */
  .card {
    background: var(--card); border-radius: 34px; /* = Rundung des Rückgängig-Knopfs (22) + sein Abstand zum Rand (12): Ecken laufen parallel */ margin-top: 14px; padding: 22px 22px 14px; /* mehr Abstand, damit der Inhalt nicht an der runden Ecke klebt */
    flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; overflow: hidden; position: relative;
  }
  /* Rückgängig / Wiederholen: Doppelknopf unten rechts in der Strich-Box */
  .tally { padding-bottom: 64px; }
  .undo-pill { position: absolute; right: 12px; bottom: 12px; z-index: 2; display: flex; height: 44px; border-radius: 22px; /* 84 × 44, etwas gestaucht */
    background: var(--btn-glass); box-shadow: var(--rim-gray);
    -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); }
  .undo-pill button { width: 42px; height: 44px; border-radius: 22px; display: grid; place-items: center; color: var(--label); transition: opacity .25s ease; }
  .undo-pill button:first-child { padding-left: 3px; }
  .undo-pill button:last-child { padding-right: 3px; }
  .undo-pill svg { width: 22px; height: 22px; }
  .undo-pill button:disabled { opacity: .3; }
  .undo-pill .redo svg { transform: scaleX(-1); }
  /* Erst sichtbar, wenn es etwas rückgängig zu machen gibt – taucht weich auf */
  /* Wächst aus der Mitte des Knopfes heraus und schrumpft wieder in die Mitte hinein */
  .undo-pill { opacity: 0; transform: scale(.2); transform-origin: 50% 50%; pointer-events: none;
    transition: opacity .22s ease .06s, transform .32s cubic-bezier(.5,0,.75,0); }
  .undo-pill.on { opacity: 1; transform: none; pointer-events: auto;
    transition: opacity .18s ease, transform .55s var(--bounce); }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; }
  .tab-name { font-size: 20px; font-weight: 600; letter-spacing: .38px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .count { font-size: 15px; color: var(--label2); flex: none; margin-left: 12px; font-variant-numeric: tabular-nums; }
  .tally {
    margin-top: 12px; flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    display: flex; flex-wrap: wrap; gap: 0; align-content: flex-start;
  }
  .tally svg { width: 52px; height: 46px; flex: none; scroll-margin: 6px; }
  .tally line { stroke: var(--tally); stroke-width: 3.8; stroke-linecap: round; }
  .tally line.half { stroke: var(--orange); }
  /* Neu: Strich zeichnet sich grün und wird dann normal */
  /* Farben blenden weich: grün zeichnen, kurz halten, dann langsam zu weiß */
  /* Neu: Strich zeichnet sich sichtbar grün von oben nach unten und wird dann normal.
     Weg: genau rückwärts – erst rot, dann zieht er sich gleichmäßig zurück.
     Strichmuster = echte Länge (senkrecht 36, schräg 50, halb 18), sonst springt die Animation. */
  .tally line.new { stroke-dasharray: 36; stroke-dashoffset: 36; animation: draw 1.15s linear forwards; }
  .tally line.out { stroke-dasharray: 36; stroke-dashoffset: 0; animation: undraw .8s linear forwards; }
  @keyframes draw {
    0% { stroke-dashoffset: 36; stroke: var(--green); animation-timing-function: cubic-bezier(.4,0,.2,1); }
    32% { stroke-dashoffset: 0; stroke: var(--green); }
    45% { stroke-dashoffset: 0; stroke: var(--green); animation-timing-function: ease-in-out; }
    100% { stroke-dashoffset: 0; stroke: var(--tally); }
  }
  @keyframes undraw {
    0% { stroke-dashoffset: 0; stroke: var(--tally); animation-timing-function: ease-out; }
    22% { stroke-dashoffset: 0; stroke: var(--red); animation-timing-function: cubic-bezier(.45,0,.25,1); }
    100% { stroke-dashoffset: 36; stroke: var(--red); opacity: .5; }
  }
  .tally line.d.new { stroke-dasharray: 50; stroke-dashoffset: 50; animation: drawD 1.15s linear forwards; }
  .tally line.d.out { stroke-dasharray: 50; stroke-dashoffset: 0; animation: undrawD .8s linear forwards; }
  @keyframes drawD {
    0% { stroke-dashoffset: 50; stroke: var(--green); animation-timing-function: cubic-bezier(.4,0,.2,1); }
    32% { stroke-dashoffset: 0; stroke: var(--green); }
    45% { stroke-dashoffset: 0; stroke: var(--green); animation-timing-function: ease-in-out; }
    100% { stroke-dashoffset: 0; stroke: var(--tally); }
  }
  @keyframes undrawD {
    0% { stroke-dashoffset: 0; stroke: var(--tally); animation-timing-function: ease-out; }
    22% { stroke-dashoffset: 0; stroke: var(--red); animation-timing-function: cubic-bezier(.45,0,.25,1); }
    100% { stroke-dashoffset: 50; stroke: var(--red); opacity: .5; }
  }
  .tally line.half.new { stroke-dasharray: 18; stroke-dashoffset: 18; animation: drawH 1.15s linear forwards; }
  .tally line.half.out { stroke-dasharray: 18; stroke-dashoffset: 0; animation: undrawH .8s linear forwards; }
  @keyframes drawH {
    0% { stroke-dashoffset: 18; stroke: var(--green); animation-timing-function: cubic-bezier(.4,0,.2,1); }
    32% { stroke-dashoffset: 0; stroke: var(--green); }
    45% { stroke-dashoffset: 0; stroke: var(--green); animation-timing-function: ease-in-out; }
    100% { stroke-dashoffset: 0; stroke: var(--orange); }
  }
  @keyframes undrawH {
    0% { stroke-dashoffset: 0; stroke: var(--orange); animation-timing-function: ease-out; }
    22% { stroke-dashoffset: 0; stroke: var(--red); animation-timing-function: cubic-bezier(.45,0,.25,1); }
    100% { stroke-dashoffset: 18; stroke: var(--red); opacity: .5; }
  }
  .tally svg.half-svg { width: 14px; }
  /* Datum über den Strichen eines Tages */
  .day { flex: 0 0 100%; overflow: hidden; padding-bottom: 10px; }
  .day-lab { margin: 0 2px 4px; font-size: 12px; font-weight: 600; color: var(--label2); letter-spacing: .1px; }
  .day-st { display: flex; flex-wrap: wrap; gap: 10px 14px; }
  .tally.swap > * { animation: swapIn .28s var(--spring) both; }
  @keyframes swapIn { from { opacity: 0; transform: translate3d(var(--sx, 0px), var(--sy, 6px), 0); } to { opacity: 1; transform: none; } }
  .card .tally.dragx { transition: none; }
  .card .tally.back { transition: transform .45s var(--spring), opacity .3s ease; }
  .card-head, .legend { transition: opacity .2s; }
  .empty { align-content: center; } /* Text + Hinweis als ein Block in der Mitte */
  .empty small { display: block; margin-top: 6px; font-size: 13px; opacity: .7; }
  .sum-value { display: inline-block; }
  .sum-value.bump { animation: bump .3s var(--bounce); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
  .empty { width: 100%; min-height: 100%; flex: 1; display: grid; place-items: center; text-align: center; color: var(--label3); font-size: 15px; animation: emptyIn .5s ease both; }
  @keyframes emptyIn { from { opacity: 0; } }

  /* Clicker */
  .clicker-wrap { display: flex; justify-content: center; align-items: center; gap: 0; justify-content: space-evenly; padding: 5px 0 19px; /* mittig zwischen Box und Trennlinie (14 px Abstand der Leiste + 5 = 19 = 19) */ max-width: 520px; margin: 0 auto; }
  .clicker, .minus {
    width: min(118px, 31vw); height: min(118px, 31vw); border-radius: 50%; flex: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    transition: transform .34s var(--bounce), box-shadow .3s ease, background .3s ease, color .3s ease;
    -webkit-user-select: none; user-select: none;
  }
  .clicker {
    background: var(--green); color: #fff;
    box-shadow: 0 10px 28px rgba(52,199,89,.30), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .minus {
    background: var(--fill); color: var(--red);
  }
  .clicker:active, .minus:active:not(:disabled) { transform: scale(.9); transition-duration: .07s; }
  .clicker:active { box-shadow: 0 4px 12px rgba(52,199,89,.30); }
  .clicker svg, .minus svg { width: 38px; height: 38px; }
  .clicker span, .minus span { font-size: 16px; font-weight: 600; opacity: .9; }
  .minus.off { color: var(--label3); }
  /* Plus/Minus: echter (unsichtbarer) iOS-Schalter im Knopf – iOS gibt Web-Seiten nur bei einem echten Fingertipp auf einen Schalter Haptik */
  .clicker, .minus { cursor: pointer; position: relative; }
  .hap { position: absolute; left: 50%; top: 50%; width: 1px; height: 1px; margin: 0; opacity: 0; pointer-events: none; }

  /* Farbauswahl */
  .colors { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; justify-items: center; margin-top: 18px; }
  .swatch {
    width: 40px; height: 40px; border-radius: 50%; position: relative;
    transition: transform .3s var(--bounce);
  }
  .swatch:active { transform: scale(.9); }
  .swatch.sel::after {
    content: ""; position: absolute; inset: -5px; border-radius: 50%;
    border: 2.5px solid var(--label2);
  }
  /* Wie in der Dynamic Island: Punkt sitzt mittig im runden Ende, überall gleich weit vom Rand (10 px) */
  .chip { display: inline-flex; align-items: center; }

  }
  .side-new svg { width: 22px; height: 22px; color: #fff; margin: -2px 0; } /* Plus etwas größer, Knopf bleibt gleich */
  /* ---------- Statistik pro Tab ---------- */
  #sideStats { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  .side-page::-webkit-scrollbar, .side-scroll::-webkit-scrollbar { display: none; }
  .side-scroll { scrollbar-width: none; }
  .side-row .chev2 { width: 13px; height: 13px; flex: none; color: var(--label3); margin-left: -4px; }
  .st-head { display: flex; align-items: center; gap: 6px; padding: 4px 4px 2px; }
  .st-head .sdot { width: 14px; height: 14px; border-radius: 50%; flex: none; margin-left: 2px; }
  .st-head .st-name { flex: 1; min-width: 0; font-size: 22px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .st-now { padding: 10px 12px 2px; font-size: 40px; font-weight: 700; letter-spacing: -.8px; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .st-sub { padding: 2px 12px 0; font-size: 15px; color: var(--label2); font-variant-numeric: tabular-nums; }
  .st-sub b { font-weight: 600; }
  .st-sub .up { color: var(--green); } .st-sub .down { color: var(--red); }
  .seg { position: relative; display: flex; margin: 16px 4px 4px; height: 34px; padding: 2px; border-radius: 17px; background: var(--fill); transition: scale .4s var(--bounce); }
  /* Daumen = unsichtbarer Träger (Position); das Aussehen liegt im ::before. Beim Greifen wächst das ::before
     in echten Pixeln (nicht per scale) – so bleiben die Ecken sauber rund statt verzerrt/abgeschnitten. */
  .seg-thumb { position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc((100% - 4px) / 4);
    transition: translate .45s var(--spring); }
  .seg-thumb::before { content: ""; position: absolute; inset: 0; border-radius: 15px;
    background: var(--seg-thumb, #fff); box-shadow: 0 2px 6px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04);
    transition: inset .45s var(--bounce), border-radius .45s var(--bounce), background-color .3s ease, box-shadow .3s ease; }
  /* Gegriffen wie iOS 26: klare Glas-Linse, etwas größer als die Leiste, gleitet mit dem Finger; beim Loslassen schrumpft sie zurück */
  :root { --lens-bg: rgba(255,255,255,.30); --lens-sh: inset 0 1px 1.5px rgba(255,255,255,.9), inset 0 -1px 1.5px rgba(255,255,255,.5), inset 0 0 0 .5px rgba(0,0,0,.14), 0 6px 18px rgba(0,0,0,.16); }
  :root[data-theme="dark"] { --lens-bg: rgba(255,255,255,.10); --lens-sh: inset 0 1px 1.5px rgba(255,255,255,.55), inset 0 -1px 1.5px rgba(255,255,255,.2), inset 0 0 0 .5px rgba(255,255,255,.3), 0 8px 20px rgba(0,0,0,.35); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --lens-bg: rgba(255,255,255,.10); --lens-sh: inset 0 1px 1.5px rgba(255,255,255,.55), inset 0 -1px 1.5px rgba(255,255,255,.2), inset 0 0 0 .5px rgba(255,255,255,.3), 0 8px 20px rgba(0,0,0,.35); } }
  .seg-thumb.grab { z-index: 2; }
  .seg-thumb.grab::before { inset: -8px -9px; border-radius: 23px; background: var(--lens-bg); box-shadow: var(--lens-sh);
    -webkit-backdrop-filter: saturate(170%) brightness(1.06); backdrop-filter: saturate(170%) brightness(1.06); }
  .seg.grabbing { scale: 1.03; }
  .seg-thumb.drag { transition: none; }
  .seg { touch-action: none; -webkit-user-select: none; user-select: none; }
  .seg button { pointer-events: none; transition: opacity .2s ease; }
  :root[data-theme="dark"] .seg-thumb { --seg-thumb: #5A5A5E; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg-thumb { --seg-thumb: #5A5A5E; } }
  .seg button { position: relative; z-index: 1; flex: 1; border-radius: 15px; font-size: 14px; font-weight: 600; color: var(--label); }
  .stat-chart { position: relative; margin: 38px 4px 0; height: 196px; touch-action: none; }
  .stat-chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .stat-chart .grid { stroke: var(--sep); stroke-width: .5; }
  .stat-chart .ylab, .stat-chart .xlab { fill: var(--label2); font-size: 11px; font-variant-numeric: tabular-nums; }
  .stat-chart .ln { fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  .stat-chart .ln.draw { animation: stDraw .9s var(--spring) forwards; }
  @keyframes stDraw { to { stroke-dashoffset: 0; } }
  .stat-chart .area { opacity: 0; animation: stFade .6s ease .25s forwards; }
  @keyframes stFade { to { opacity: 1; } }
  .stat-chart .scrub { opacity: 0; transition: opacity .15s ease; }
  .stat-chart.scrubbing .scrub { opacity: 1; }
  .stat-chart.scrubbing .enddot { opacity: 0; }
  .st-tip { position: absolute; top: -6px; left: 0; transform: translate(-50%, -100%); padding: 4px 10px; border-radius: 12px;
    background: var(--side-sel); box-shadow: 0 2px 8px rgba(0,0,0,.14); font-size: 13px; font-weight: 600; white-space: nowrap;
    font-variant-numeric: tabular-nums; pointer-events: none; opacity: 0; transition: opacity .15s ease; }
  .st-tip span { font-weight: 500; color: var(--label2); margin-right: 6px; }
  .stat-chart.scrubbing .st-tip { opacity: 1; }
  .st-empty { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font-size: 13px; color: var(--label2); padding: 0 24px; line-height: 1.4; }
  .st-list { margin: 18px 0 0; }
  .st-list .side-row { min-height: 40px; }
  .st-list .side-row:active { background: none; }
  .st-list .k { flex: 1; color: var(--label2); font-size: 15px; }
  .st-list .v { flex: none; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .st-open { display: flex; align-items: center; justify-content: center; width: 100%; height: 48px; margin: 0; border-radius: 24px;
    background: var(--st-c, var(--blue)); color: var(--st-on, #fff); font-size: 17px; font-weight: 600; box-shadow: var(--rim-color); }

  /* ---------- Glas-Morph (#95): Knopf verwandelt sich wie in iOS 26 in ein Glas-Menü ---------- */
   /* Rand: echte Ebenen mit --rim-gray (genau wie alle anderen Glas-Knöpfe), folgen der Form */
  :root { --mg-btn: rgba(255,255,255,.18); --mg-menu: rgba(255,255,255,.74); --mg-press: rgba(255,255,255,.95); }
  :root[data-theme="dark"] { --mg-btn: rgba(118,118,128,.24); --mg-menu: rgba(128,128,136,.30); --mg-press: rgba(170,170,180,.50); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --mg-btn: rgba(118,118,128,.24); --mg-menu: rgba(128,128,136,.30); --mg-press: rgba(170,170,180,.50); } }
  .mg-rimbox { position: absolute; left: 0; top: 0; box-shadow: var(--rim-gray); pointer-events: none; will-change: transform; }
  .mg { position: fixed; left: 0; top: 0; z-index: 41; pointer-events: none; display: none; }
  .mg.on { display: block; }
  .mg-glass, .mg-clip { position: absolute; left: 0; top: 0; width: 1px; height: 1px; clip-path: path("M0 0Z"); -webkit-clip-path: path("M0 0Z"); }
  .mg-glass { -webkit-backdrop-filter: blur(11px) saturate(1.6); backdrop-filter: blur(11px) saturate(1.6); }
  .mg-rim { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; }
  .mg-content { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; opacity: 0; will-change: transform, opacity; }
  .mg-icon { position: absolute; left: 0; top: 0; display: grid; place-items: center; transform-origin: 50% 50%; will-change: transform, opacity; color: var(--label); }
  .mg.open .mg-clip, .mg.open .mg-content { pointer-events: auto; }
  .mg-shield { position: fixed; inset: 0; z-index: 40; display: none; }
  .mg-shield.on { display: block; }
  .mg-row { position: absolute; inset: 0; display: block; width: 100%; border-radius: 30px; color: var(--label); text-align: left; transition: background-color .2s ease; }
  .mg-row svg { position: absolute; left: 39px; top: 50%; transform: translate(-50%, -50%); width: 21px; height: 21px; }
  .mg-row span { position: absolute; left: 64px; top: 50%; transform: translateY(-50%); font-size: 17px; letter-spacing: -.4px; white-space: nowrap; }
  .mg-row.red { color: var(--red); }
  .mg-row.on { background: var(--fill-press); transition-duration: 0s; }
  .mg-hide { opacity: 0 !important; transition: none !important; }
  .mg-dots { display: flex; gap: 2.9px; } .mg-dots i { width: 5.3px; height: 5.3px; border-radius: 50%; background: currentColor; }
  /* „…“ oben rechts in der Seitenleiste; im Auswählen-Modus wird daraus ein X */
  .side-more { position: relative; margin-left: auto; margin-right: -8px; width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center;
    color: var(--label); background: var(--btn-glass); box-shadow: var(--refl, 0 0 #0000), var(--rim-gray); touch-action: manipulation; }
  .side-more > * { grid-area: 1 / 1; transition: transform .45s cubic-bezier(.34,1.56,.64,1), opacity .25s ease; }
  .side-more svg { width: 24px; height: 24px; opacity: 0; transform: rotate(-90deg) scale(.4); }
  .side.selecting .side-more .mg-dots { opacity: 0; transform: rotate(90deg) scale(.4); }
  .side.selecting .side-more svg { opacity: 1; transform: none; }
  /* Auswählen-Modus: Kreise vor den Tabs */
  .side-row .selc { width: 0; height: 22px; margin-right: -12px; flex: none; border-radius: 50%; display: grid; place-items: center; color: #fff;
    box-shadow: inset 0 0 0 1.6px var(--label3); opacity: 0; scale: .4;
    transition: width .42s var(--spring), margin .42s var(--spring), opacity .25s ease, scale .42s var(--spring), background-color .2s ease, box-shadow .2s ease; }
  .side-row .selc svg { width: 13px; height: 13px; opacity: 0; scale: .4; transition: opacity .18s ease, scale .3s cubic-bezier(.34,1.56,.64,1); }
  .side.selecting .side-row .selc { width: 22px; margin-right: 0; opacity: 1; scale: 1; }
  .side-row.picked .selc { background: var(--blue); box-shadow: none; }
  .side-row.picked .selc svg { opacity: 1; scale: 1; }
  .side-row .chev2 { transition: opacity .25s ease; }
  .side.selecting .side-row .chev2 { opacity: 0; }
  .side.selecting #sideTabs .side-row.on { background: transparent; }
  .side.selecting #sideTabs .side-row.picked { background: var(--side-sel); }
  /* Zahnrad → Mülleimer */
  .side-gear { position: relative; transition: background-color .35s ease, color .35s ease, box-shadow .35s ease; }
  .side-gear svg { grid-area: 1 / 1; transition: transform .55s cubic-bezier(.34,1.56,.64,1), opacity .25s ease, filter .3s ease; }
  .side-gear .g-trash { opacity: 0; transform: rotate(40deg) scale(.3); filter: blur(3px); }
  .side.selecting .side-gear .g-gear { opacity: 0; transform: rotate(-120deg) scale(.3); filter: blur(3px);
    transition: transform .36s cubic-bezier(.5,0,.75,0), opacity .2s ease .08s, filter .25s ease; }
  .side.selecting .side-gear .g-trash { opacity: 1; transform: none; filter: none; transition-delay: .1s; }
  .side.selecting .side-gear { color: var(--label3); }
  .side.selecting.has-sel .side-gear { background: var(--red); color: #fff; box-shadow: var(--refl, 0 0 #0000), var(--rim-color); }
  .side-gear.pop { animation: gearPop .6s cubic-bezier(.3,.7,.4,1); }
  @keyframes gearPop { 0% { scale: 1; } 30% { scale: .82; } 64% { scale: 1.08; } 100% { scale: 1; } }
  .side-gear .lid { transform-box: fill-box; transform-origin: 85% 100%; }
  .side-gear.lid-pop .lid { animation: lidPop .55s ease; }
  @keyframes lidPop { 0% { rotate: 0deg; } 35% { rotate: -24deg; } 70% { rotate: 6deg; } 100% { rotate: 0deg; } }
  .side-new { transition: opacity .3s ease, scale .45s var(--spring), filter .3s ease; }
  .side.selecting .side-new { opacity: 0; scale: .8; filter: blur(4px); pointer-events: none; }
</style>
</head>
<body>
<!-- Seitenleiste (wie in der Claude-App): gleitet von links herein, die App rutscht nach rechts -->
<div class="side-scrim" id="sideScrim"></div>
<aside class="side" id="side" aria-label="Menü">
  <div class="side-scroll">
    <div class="side-title"><svg class="logo" viewBox="0 0 38 34" aria-hidden="true"><line x1="6" y1="5" x2="6" y2="29"/><line x1="14" y1="5" x2="14" y2="29"/><line x1="22" y1="5" x2="22" y2="29"/><line x1="30" y1="5" x2="30" y2="29"/><line class="d" x1="2" y1="24" x2="35" y2="9"/></svg><span class="word">Tally</span><button class="side-more" id="sideMore" aria-label="Mehr"><span class="mg-dots"><i></i><i></i><i></i></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div>
    <div class="side-sec">Tabs</div>
    <div id="sideTabs"></div>
  </div>
  <!-- Unterseite: Einstellungen (gleitet innerhalb der Seitenleiste von rechts herein) -->
  <div class="side-page" id="sidePage">
    <div class="side-head">
      <button class="side-back" id="sideBack" aria-label="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span>Einstellungen</span>
    </div>
    <div class="side-sec">Darstellung</div>
      <button class="side-row" data-theme-opt="auto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg><span>Automatisch</span><svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      <button class="side-row" data-theme-opt="light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Hell</span><svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      <button class="side-row" data-theme-opt="dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span>Dunkel</span><svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    <p class="side-foot" style="padding-top:8px">„Automatisch“ folgt der Einstellung deines iPhones.</p>
    <div class="side-sec">Daten</div>
      <button class="side-row" id="sideExport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10H7a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-1"/><path d="M12 3v11M8.5 6.5 12 3l3.5 3.5"/></svg><span>Daten exportieren</span></button>
      <button class="side-row" id="sideImport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10H7a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-1"/><path d="M12 3v11M8.5 10.5 12 14l3.5-3.5"/></svg><span>Daten importieren</span></button>
    <p class="side-foot">Version 10.11. #99</p>
  </div>
  <!-- Unterseite: Statistik eines Tabs (antippen in der Liste) -->
  <div class="side-page" id="sideStats">
    <div class="st-head">
      <button class="side-back" id="statBack" aria-label="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="sdot" id="statDot"></span><span class="st-name" id="statName"></span>
    </div>
    <div class="st-now" id="statNow"></div>
    <div class="st-sub" id="statSub"></div>
    <div class="seg" id="statSeg">
      <div class="seg-thumb" id="statThumb"></div>
      <button data-r="7">Woche</button><button data-r="30">Monat</button><button data-r="365">Jahr</button><button data-r="0">Alles</button>
    </div>
    <div class="stat-chart" id="statChart"></div>
    <div class="st-list" id="statList"></div>
    <div class="st-foot"><button class="st-open" id="statOpen">Tab öffnen</button></div>
  </div>
  <div class="side-bottom">
    <button class="side-gear" id="sideGear" aria-label="Einstellungen"><svg class="g-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="lid"><path d="M3.8 6.6h16.4"/><path d="M9.2 6.4V5a1.6 1.6 0 0 1 1.6-1.6h2.4A1.6 1.6 0 0 1 14.8 5v1.4"/></g><path d="M5.9 6.8l.9 12.1a2 2 0 0 0 2 1.9h6.4a2 2 0 0 0 2-1.9l.9-12.1"/><path d="M10 10.8v6M14 10.8v6"/></svg><svg class="g-gear" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" fill-rule="evenodd" d="M9.84 4.19 L10.18 2.17 L13.82 2.17 L14.16 4.19 L15.99 4.95 L17.66 3.76 L20.24 6.34 L19.05 8.01 L19.81 9.84 L21.83 10.18 L21.83 13.82 L19.81 14.16 L19.05 15.99 L20.24 17.66 L17.66 20.24 L15.99 19.05 L14.16 19.81 L13.82 21.83 L10.18 21.83 L9.84 19.81 L8.01 19.05 L6.34 20.24 L3.76 17.66 L4.95 15.99 L4.19 14.16 L2.17 13.82 L2.17 10.18 L4.19 9.84 L4.95 8.01 L3.76 6.34 L6.34 3.76 L8.01 4.95Z M16.10 12 A4.1 4.1 0 1 0 7.90 12 A4.1 4.1 0 1 0 16.10 12Z"/></svg></button>
    <button class="side-new" id="sideNew"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Neuer Tab</button>
  </div>
</aside>

<div class="app">
  <header>
    <button class="gear" id="settingsBtn" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4.5 7h15M4.5 12h15M4.5 17h15"/></svg></button>
    <div class="hbtns">
      <button class="gear" id="payBtn" aria-label="Abrechnen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 7.5V6a1.5 1.5 0 0 0-1.5-1.5H6A2.5 2.5 0 0 0 3.5 7v10A2.5 2.5 0 0 0 6 19.5h12a2.5 2.5 0 0 0 2.5-2.5v-7A2.5 2.5 0 0 0 18 7.5H6"/><path d="M16.5 13.75h.01" stroke-width="3"/></svg></button>
      <button class="more" id="addBtn" aria-label="Tab hinzufügen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <section class="card">
    <div class="card-head">
      <div class="tab-name" id="tabName"></div>
      <div class="count" id="count"></div>
    </div>
    <button type="button" class="legend" id="legend" aria-label="Wert pro Strich ändern"></button>
    <div class="tally" id="tally"></div>
    <div class="undo-pill" id="undoPill">
      <button class="undo" id="undoBtn" aria-label="Rückgängig" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4.5L4.5 9l4.5 4.5"/><path d="M5 9h9.75a4.75 4.75 0 0 1 0 9.5H11.5"/></svg></button>
      <button class="redo" id="redoBtn" aria-label="Wiederholen" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4.5L4.5 9l4.5 4.5"/><path d="M5 9h9.75a4.75 4.75 0 0 1 0 9.5H11.5"/></svg></button>
    </div>
  </section>

<footer class="dock" id="dock">
  <div class="clicker-wrap">
    <label class="minus" id="minus" role="button" aria-label="Strich entfernen"><input type="checkbox" switch class="hap" tabindex="-1" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>
      <span class="val">10 €</span>
    </label>
    <label class="clicker" id="clicker" role="button" aria-label="Strich hinzufügen"><input type="checkbox" switch class="hap" tabindex="-1" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span class="val">10 €</span>
    </label>
  </div>
  <div class="sumbar-inner">
    <div>
      <div class="sum-label">Summe</div>
      <div class="sum-total" id="sumAll"></div>

<script>
(function () {
  const STANDALONE = true;
  const VALUE = 10;
  const LS_KEY = "geldzaehler.v1";
  const $ = (id) => document.getElementById(id);
  const fmt0 = new Intl.NumberFormat("de-DE", { maximumFractionDigits: 0 });
  const fmt2 = new Intl.NumberFormat("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const num = (n) => { n = Math.round(n * 100) / 100; return Number.isInteger(n) ? fmt0.format(n) : fmt2.format(n); };
  const euro = (n) => num(n) + " €";
  // Wert eines Strichs pro Tab (Standard 10 €)
  const valOf = (t) => (Number(t && t.value) > 0 ? Number(t.value) : VALUE);
  const uid = () => Math.random().toString(36).slice(2, 10);

  // Apple-Systemfarben: [hell, dunkel, Textfarbe darauf]
  const COLORS = {
    blue:   ["#007AFF", "#0A84FF", "#fff"],
    green:  ["#34C759", "#30D158", "#fff"],
    red:    ["#FF3B30", "#FF453A", "#fff"],
    orange: ["#FF9500", "#FF9F0A", "#fff"],
    yellow: ["#FFCC00", "#FFD60A", "#000"],
    pink:   ["#FF2D55", "#FF375F", "#fff"],
    purple: ["#AF52DE", "#BF5AF2", "#fff"],
    indigo: ["#5856D6", "#5E5CE6", "#fff"],
    teal:   ["#30B0C7", "#40C8E0", "#fff"],
    gray:   ["#8E8E93", "#98989D", "#fff"],
  };
  const darkMQ = window.matchMedia("(prefers-color-scheme: dark)");
  const colorOf = (key) => (Object.prototype.hasOwnProperty.call(COLORS, key) ? COLORS[key] : COLORS.blue);
  // Darstellung: "auto" | "light" | "dark" (nur auf diesem Gerät gespeichert)
  let theme = "auto";
  try { const t = localStorage.getItem("tally.theme"); if (t === "light" || t === "dark") theme = t; } catch (e) {}
  const isDark = () => theme === "dark" || (theme === "auto" && darkMQ.matches);
  const hexOf = (key) => colorOf(key)[isDark() ? 1 : 0];
  // Hell/Dunkel weich überblenden: alle Farben gleiten hinüber.
  // (Keine Bild-Überblendung – die hat auf dem iPhone den grünen Knopf durch das Milchglas-Pop-up gezeigt.)
  function smoothTheme(change) {
    const root = document.documentElement;
    root.classList.add("theme-anim");
    change(); reflectSoon();
    clearTimeout(smoothTheme._t);
    smoothTheme._t = setTimeout(() => root.classList.remove("theme-anim"), 700);
  }
  function applyTheme() {
    if (theme === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", theme);
    document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.setAttribute("content", isDark() ? "#000000" : "#F2F2F7"));
    // Statusleiste: Design der App bestimmt hell/dunkel, auch wenn das iPhone anders eingestellt ist
    const cs = document.querySelector('meta[name="color-scheme"]');
    if (cs) cs.setAttribute("content", theme === "auto" ? "light dark" : theme);
  }
  function applyAccent(key) {
    const hex = hexOf(key), r = document.documentElement.style;
    r.setProperty("--accent", hex);
    r.setProperty("--on-accent", colorOf(key)[2]);
    r.setProperty("--accent-shadow", hex + "4D");
  }

  function defaultState() {
    const id = uid();
    return { tabs: [{ id, name: "Tab 1", count: 0 }], activeId: id, updatedAt: 0 };
  }
  function valid(s) {
    return s && Array.isArray(s.tabs) && s.tabs.length > 0 &&
      s.tabs.every(t => t && typeof t.id === "string" && typeof t.name === "string" && Number.isFinite(t.count));
  }
  function clone(s) { return JSON.parse(JSON.stringify(s)); }

  // ---------- Lokaler Speicher (sofort) ----------
  function loadLocal() {
    try { const s = JSON.parse(localStorage.getItem(LS_KEY)); if (valid(s)) return s; } catch (e) {}
    return null;
  }
  function saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
  }

  let state = loadLocal() || defaultState();
  if (!state.tabs.some(t => t.id === state.activeId)) state.activeId = state.tabs[0].id;
  // ---------- Verlauf für die Statistik: [Zeit, Betrag] bei jeder Änderung ----------
  // Ältere Tabs ohne Verlauf starten ab jetzt mit ihrem aktuellen Betrag.
  function cleanHist(h) {
    if (!Array.isArray(h)) return null;
    const out = h.filter(p => Array.isArray(p) && Number.isFinite(p[0]) && Number.isFinite(p[1]))
      .map(p => [Math.round(p[0]), Math.max(0, Math.round(p[1] * 100) / 100)]).sort((a, b) => a[0] - b[0]);
    return out.length ? out : null;
  }
  function recordHist() {
    const now = Date.now();
    state.tabs.forEach(t => {
      const m = moneyOf(t);
      if (!Array.isArray(t.hist) || !t.hist.length) { t.hist = [[now, m]]; return; }
      const h = t.hist, last = h[h.length - 1];
      if (Math.abs(last[1] - m) < .005) return;
      // schnelle Klicks hintereinander (unter 2 Min.) zu einem Punkt zusammenfassen
      if (h.length >= 2 && now - last[0] < 120000) {
        last[0] = now; last[1] = m;
        if (Math.abs(h[h.length - 2][1] - m) < .005) h.pop();
      } else h.push([now, m]);
      if (h.length > 4000) t.hist = h.filter((p, i) => i > 2000 || i % 2 === 0); // Speicher klein halten
    });
  }
  // ---------- Datum pro Strich: t.sd[i] = Tag, an dem Strich i dazukam ("JJJJ-MM-TT"; null = schon vorher da) ----------
  const dayKey = (d) => { d = d || new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  function cleanSd(sd, count) {
    sd = Array.isArray(sd) ? sd.map(x => (typeof x === "string" && /^\d{4}-\d\d-\d\d$/.test(x)) ? x : null) : [];
    if (sd.length > count) sd = sd.slice(0, count);
    while (sd.length < count) sd.unshift(null);
    return sd;
  }
  // Neue Striche bekommen das heutige Datum, weggenommene verschwinden vom Ende
  function syncSd() {
    state.tabs.forEach(t => {
      const n = Math.max(0, t.count | 0);
      if (!Array.isArray(t.sd)) t.sd = [];
      if (t.sd.length > n) t.sd.length = n;
      while (t.sd.length < n) t.sd.push(dayKey());
    });
  }
  state.tabs.forEach(t => { t.hist = cleanHist(t.hist); t.sd = cleanSd(t.sd, Math.max(0, t.count | 0)); });
  recordHist();
  let lastAdded = -1;
  let swapping = false;

  const active = () => state.tabs.find(t => t.id === state.activeId) || state.tabs[0];

  // ---------- Render ----------
  function tallyGroup(n, startIndex, outFrom = Infinity) {
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 52 46");
    const xs = [8, 18, 28, 38];
    for (let i = 0; i < Math.min(n, 4); i++) {
      const l = document.createElementNS(ns, "line");
      l.setAttribute("x1", xs[i]); l.setAttribute("x2", xs[i]);
      l.setAttribute("y1", 5); l.setAttribute("y2", 41);
      if (startIndex + i === lastAdded) l.classList.add("new");
      if (startIndex + i >= outFrom) l.classList.add("out");
      svg.appendChild(l);
    }
    if (n === 5) {
      const l = document.createElementNS(ns, "line");
      l.setAttribute("x1", 2); l.setAttribute("y1", 34);
      l.setAttribute("x2", 46); l.setAttribute("y2", 12);
      l.classList.add("d");
      if (startIndex + 4 === lastAdded) l.classList.add("new");
      if (startIndex + 4 >= outFrom) l.classList.add("out");
      svg.appendChild(l);
    }
    return svg;
  }
  // Halber, oranger Strich für den Rest, der keinen ganzen Strich ergibt (z. B. Cent)
  function halfStroke(cls) {
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 14 46");
    svg.classList.add("half-svg");
    const l = document.createElementNS(ns, "line");
    l.setAttribute("x1", 7); l.setAttribute("x2", 7);
    l.setAttribute("y1", 41); l.setAttribute("y2", 23);
    l.setAttribute("class", "half" + (cls ? " " + cls : ""));
    svg.appendChild(l);
    return svg;
  }
  // Tageszeile weich auf- bzw. zuklappen (Höhe + Deckkraft), damit nichts springt
  const EASE = "cubic-bezier(.32,.72,0,1)";
  function dayIn(el) {
    if (!el.animate) return;
    requestAnimationFrame(() => {
      const h = el.scrollHeight;
      el.animate([{ height: "0px", opacity: 0, transform: "translateY(-6px)" }, { height: h + "px", opacity: 1, transform: "none" }], { duration: 480, easing: EASE });
    });
  }
  function dayOut(el) {
    if (!el.animate) return;
    requestAnimationFrame(() => {
      const h = el.offsetHeight;
      el.animate([{ height: h + "px", opacity: 1 }, { height: "0px", opacity: 0 }], { duration: 300, delay: 500, easing: "cubic-bezier(.4,0,.2,1)", fill: "forwards" });
    });
  }
  function chipPositions() {
    const m = new Map();
    (window.__chips || new Map()).forEach((b, id) => { if (b.isConnected) m.set(id, b.getBoundingClientRect().left); });
    return m;
  }
  function flipChips(firstX) {
    (window.__chips || new Map()).forEach((b, id) => {
      const x0 = firstX.get(id);
      if (x0 == null || !b.animate) return;
      const dx = x0 - b.getBoundingClientRect().left;
      if (Math.abs(dx) < 1) return;
      b.animate([{ translate: dx + "px 0" }, { translate: "0 0" }], { duration: 520, easing: "cubic-bezier(.32,.72,0,1)" });
    });
  }
  // Tab-Leiste live umsortieren (beim Ziehen in der Seitenleiste)
  function orderChips(ids) {
    const tabsEl = $("tabs"), chips = window.__chips;
    if (!chips) return;
    const firstX = chipPositions();
    ids.forEach(id => { const b = chips.get(id); if (b) tabsEl.appendChild(b); });
    flipChips(firstX);
  }
  // Formulare ohne echtes Absenden: In Claude (PC-App und iPhone) läuft die App in einem abgeschotteten Rahmen,
  // der das Absenden von Formularen blockiert – dann passierte beim Haken/„Abziehen“/Enter gar nichts.
  // Deshalb lösen Knöpfe und Enter das „submit“-Ereignis selbst aus.
  function bindSubmit(form) {
    const fire = () => form.dispatchEvent(new Event("submit", { cancelable: true }));
    form.querySelectorAll('button[type="submit"]').forEach(b => { b.type = "button"; b.addEventListener("click", fire); });
    form.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.matches("input")) { e.preventDefault(); fire(); } });
  }
  // „Heute“, „Gestern“, „Mo., 3. Nov.“ – ältere Striche ohne Datum: „Früher“
  function dayLabel(k) {
    if (!k) return "Früher";
    const [y, m, d] = k.split("-").map(Number), dt = new Date(y, m - 1, d);
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const diff = Math.round((today - dt) / 864e5);
    if (diff === 0) return "Heute";
    if (diff === 1) return "Gestern";
    const o = { weekday: "short", day: "numeric", month: "short" };
    if (y !== today.getFullYear()) o.year = "numeric";
    return dt.toLocaleDateString("de-DE", o);
  }
  // Ganze Striche + Rest aus dem Betrag
  function strokesOf(t) {
    const total = moneyOf(t), val = valOf(t);
    const full = Math.floor(total / val + 1e-9);
    let rest = Math.round((total - full * val) * 100) / 100;
    if (rest < 0.005) rest = 0;
    return { full, rest };
  }
  let shown = { id: null, full: 0, rest: 0 }, fadeNext = false, fadeT = 0, halfLater = false;

  // Summe zählt beim Tab-Wechsel weich zur neuen Zahl (statt umzuspringen)
  var sumShown = null, sumRaf = 0;
  function setSum(v, dur) {
    const el = $("sum");
    cancelAnimationFrame(sumRaf);
    if (sumShown === null || !dur || Math.abs(v - sumShown) < .005) { sumShown = v; el.textContent = euro(v); return; }
    const from = sumShown, t0 = performance.now();
    const cents = Math.round(from * 100) % 100 !== 0 || Math.round(v * 100) % 100 !== 0;
    const step = (now) => {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 4); // sanft auslaufend
      const cur = from + (v - from) * e;
      sumShown = k < 1 ? cur : v;
      el.textContent = euro(k < 1 ? (cents ? Math.round(cur * 100) / 100 : Math.round(cur)) : v);
      if (k < 1) sumRaf = requestAnimationFrame(step);
    };
    sumRaf = requestAnimationFrame(step);
  }

  function render() {
    const tab = active();
    const switchingTab = swapping;

    // Tabs
    const tabsEl = $("tabs");
    applyAccent(tab.color);
    // Tab-Knöpfe bleiben erhalten (nicht neu gebaut) – so laufen Drück-Feder und Farbwechsel flüssig weiter
    const chipEls = window.__chips || (window.__chips = new Map());
    const keep = new Set();
    const prevOrder = [...tabsEl.children].map(c => c.__id).join();
    const firstX = chipPositions();
    state.tabs.forEach(t => {
      let b = chipEls.get(t.id);
      if (!b) {
        b = document.createElement("button");
        b.className = "chip";
        b.innerHTML = '<span class="dot"></span><span class="cl"></span>';
        chipEls.set(t.id, b); b.__id = t.id;
        glassPress(b, 1.14, 1.08);
      }
      const isActive = t.id === tab.id;
      b.classList.toggle("active", isActive);
      b.classList.toggle("dotted", !isActive);
      b.querySelector(".dot").style.background = hexOf(t.color);
      b.querySelector(".cl").textContent = t.name;
      b.onclick = () => {
        if (b._noClick) return;
        if (t.id === state.activeId) { openActions(); return; }
        state.activeId = t.id; lastAdded = -1; swapping = true; commit(false);
      };
      tabsEl.appendChild(b);
      keep.add(t.id);
    });
    chipEls.forEach((b, id) => { if (!keep.has(id)) { b.remove(); chipEls.delete(id); } });
    if (prevOrder && prevOrder !== state.tabs.map(t => t.id).join()) flipChips(firstX);

    // Aktiven Tab sichtbar halten (nur seitwärts scrollen)
    const act = tabsEl.querySelector(".chip.active");
    if (act) {
      const left = act.offsetLeft - 16, right = act.offsetLeft + act.offsetWidth + 16 - tabsEl.clientWidth;
      if (tabsEl.scrollLeft > left) tabsEl.scrollLeft = left;
      else if (tabsEl.scrollLeft < right) tabsEl.scrollLeft = right;
    }

    // Karte
    $("tabName").textContent = tab.name;
    const st = strokesOf(tab);
    $("count").textContent = (st.full === 1 ? "1 Strich" : st.full + " Striche") + (st.rest ? " + " + euro(st.rest) : "");
    const tally = $("tally");
    tally.textContent = "";
    tally.classList.toggle("swap", swapping);
    // Weggenommene Striche erst rückwärts animieren, dann entfernen
    const same = shown.id === tab.id && !swapping && fadeNext;
    const drawn = same ? Math.max(st.full, shown.full) : st.full;
    const halfOut = same && shown.rest > 0 && st.rest === 0;
    let halfNew = st.rest > 0 && shown.id === tab.id && !swapping && shown.rest === 0;
    if (halfLater && st.rest > 0) halfNew = true;
    halfLater = false;
    const fading = drawn > st.full || halfOut;
    swapping = false; fadeNext = false;
    const oldSd = (shown.id === tab.id && shown.sd) || [];
    shown = { id: tab.id, full: st.full, rest: st.rest, sd: (tab.sd || []).slice() };
    clearTimeout(fadeT);
    if (drawn === 0 && !st.rest && !halfOut) {
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = "Noch keine Striche – tippe auf +.";
      if (state.tabs.length > 1) { const sm = document.createElement("small"); sm.textContent = "Seitlich wischen wechselt den Tab."; e.appendChild(sm); }
      tally.appendChild(e);
    } else {
      // Striche nach Tag: kleines Datum drüber, Fünferbündel pro Tag neu
      const sd = tab.sd || [], dateOf = (i) => (i < sd.length ? sd[i] : oldSd[i]) || null;

    const a = 1.52866 * r, b = 1.08849 * r, c = 0.86840 * r, d = 0.63149 * r, e = 0.07491 * r,
          f = 0.37282 * r, g = 0.16906 * r, n = (v) => Math.round(v * 100) / 100;
    const p = [];
    p.push("M", n(a), 0, "L", n(w - a), 0);
    p.push("C", n(w - b), 0, n(w - c), 0, n(w - d), n(e));
    p.push("C", n(w - f), n(g), n(w - g), n(f), n(w - e), n(d));
    p.push("C", w, n(c), w, n(b), w, n(a));
    p.push("L", w, n(h - a));
    p.push("C", w, n(h - b), w, n(h - c), n(w - e), n(h - d));
    p.push("C", n(w - g), n(h - f), n(w - f), n(h - g), n(w - d), n(h - e));
    p.push("C", n(w - c), h, n(w - b), h, n(w - a), h);
    p.push("L", n(a), h);
    p.push("C", n(b), h, n(c), h, n(d), n(h - e));
    p.push("C", n(f), n(h - g), n(g), n(h - f), n(e), n(h - d));
    p.push("C", 0, n(h - c), 0, n(h - b), 0, n(h - a));
    p.push("L", 0, n(a));
    p.push("C", 0, n(b), 0, n(c), n(e), n(d));
    p.push("C", n(g), n(f), n(f), n(g), n(d), n(e));
    p.push("C", n(c), 0, n(b), 0, n(a), 0, "Z");
    return "path('" + p.join(" ") + "')";
  }
  function shapeGroup(el) {
    const w = el.offsetWidth, h = el.offsetHeight;
    if (!w || !h) return;
    const gap = 8;
    const sq = squirclePath(w, h, devR - gap);
    // Gruppen mit Knöpfen oben: Form nur für den Hintergrund, Knöpfe dürfen beim Drücken überstehen
    if (el.querySelector(".form-head")) { el.classList.add("unclip"); el.style.setProperty("--sq", sq); return; }
    el.style.clipPath = sq;
    el.style.webkitClipPath = sq;
  }
  const shapeAll = () => {
    const groups = document.querySelectorAll(".sheet .group");
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(es => es.forEach(en => shapeGroup(en.target)));
      groups.forEach(g => ro.observe(g));
    } else groups.forEach(shapeGroup);
  };
  // Strich-Box mit iOS-Ecken (fließender Übergang statt Kreisbogen – sonst wirkt der Übergang zur Rundung wie eine Kante)
  (() => {
    const card = document.querySelector(".card");
    const shape = () => { const w = card.offsetWidth, h = card.offsetHeight; if (!w || !h) return; const p = squirclePath(w, h, 34); card.style.clipPath = p; card.style.webkitClipPath = p; };
    if (window.ResizeObserver) new ResizeObserver(shape).observe(card);
    shape();
  })();
  // Erst nachdem die App sichtbar ist (schnellerer Start)
  requestAnimationFrame(() => setTimeout(shapeAll, 50));

  // Wischen: nur die Strich-Tabelle scrollt hoch/runter, die Tab-Leiste nur seitwärts.
  // Alles andere bleibt stehen, damit die ganze Seite nicht mitwandert.
  let tStartX = 0, tStartY = 0;
  document.addEventListener("touchstart", (e) => {
    const t = e.touches[0]; tStartX = t.clientX; tStartY = t.clientY;
  }, { passive: true });
  document.addEventListener("touchmove", (e) => {
    if (e.touches.length > 1) return;
    if (e.target.closest && e.target.closest("textarea, .wheel")) return;
    const pl = e.target.closest && e.target.closest(".pay-list");
    if (pl && pl.scrollHeight > pl.clientHeight + 1) return;
    const ss = e.target.closest && e.target.closest(".side-scroll, #sideStats");
    if (ss && ss.scrollHeight > ss.clientHeight + 1) return; // Seitenleiste darf scrollen
    const t = e.touches[0];
    const dx = t.clientX - tStartX, dy = t.clientY - tStartY;
    const tally = e.target.closest && e.target.closest(".tally");
    const tabs = e.target.closest && e.target.closest(".tabs");
    if (tabs && Math.abs(dx) > Math.abs(dy)) return;          // Tabs seitwärts: erlaubt
    if (tally && Math.abs(dy) >= Math.abs(dx)) {
      const canScroll = tally.scrollHeight > tally.clientHeight + 1;
      const atTop = tally.scrollTop <= 0;
      const atBottom = tally.scrollTop + tally.clientHeight >= tally.scrollHeight - 1;
      if (canScroll && !(atTop && dy > 0) && !(atBottom && dy < 0)) return; // Striche: erlaubt
    }
    if (e.cancelable) e.preventDefault();
  }, { passive: false });
  window.addEventListener("orientationchange", () => setTimeout(fitApp, 300));
  render();
  lastSnap = snap(); // Ausgangsstand für Rückgängig



  // ---------- Automatisch aktualisieren (nur die GitHub-App) ----------
  // Beim Öffnen und beim Zurückkehren in die App wird geprüft, ob es eine neuere Version gibt.
  // Wenn ja, wird sie frisch geladen – kein Warten mehr auf den Zwischenspeicher.
  const APP_VERSION = "#99";
  async function checkUpdate() {
    if (!/github\.io$/.test(location.hostname)) return;
    try {
      const last = Number(sessionStorage.getItem("tally.upd") || 0);
      if (Date.now() - last < 60000) return; // nicht in Schleife neu laden
      const r = await fetch(location.pathname, { cache: "reload" });
      const t = await r.text(), m = t.match(/const APP_VERSION = "([^"]+)"/);
      if (m && m[1] !== APP_VERSION) { sessionStorage.setItem("tally.upd", String(Date.now())); location.reload(); }
    } catch (e) {}
  }
  setTimeout(checkUpdate, 1500);
  // Offline wie Notizen: die App wird auf dem iPhone gespeichert und startet auch ohne Internet
  if ("serviceWorker" in navigator && /github\.io$/.test(location.hostname)) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkUpdate(); });
  // ---------- Reflexe: farbige Knöpfe/Tabs in der Nähe spiegeln sich leicht im Glasrand ----------
  var reflQ = 0; // var: render() läuft schon vor dieser Zeile
  function reflectSoon() { if (!reflQ) reflQ = requestAnimationFrame(() => { reflQ = 0; reflect(); }); }
  function reflect() {
    const lights = [];
    // immer gleich viele Lichtquellen (sonst kann die Farbe nicht weich überblenden)
    const add = (el) => {
      if (!el) { lights.push(null); return; }
      const c = getComputedStyle(el).backgroundColor, m = c.match(/\d+(\.\d+)?/g);
      if (!m || (m[3] !== undefined && +m[3] < .5)) { lights.push(null); return; }
      lights.push({ el, r: el.getBoundingClientRect(), rgb: m.slice(0, 3).join(",") });
    };
    add(document.querySelector("#tabs .chip.active"));
    add($("addBtn"));
    add($("clicker"));
    document.querySelectorAll(".gear, .more, .minus").forEach(btn => {
      const b = btn.getBoundingClientRect(), cx = b.left + b.width / 2, cy = b.top + b.height / 2, rad = b.width / 2;
      const parts = [];
      lights.forEach(L => {
        const none = () => parts.push("inset 0px 0px 3px -1px rgba(" + (L ? L.rgb : "0,0,0") + ",0)");
        if (!L || L.el === btn) return none(); // sich selbst nicht
        const nx = Math.max(L.r.left, Math.min(cx, L.r.right)), ny = Math.max(L.r.top, Math.min(cy, L.r.bottom));
        const dx = nx - cx, dy = ny - cy, d = Math.hypot(dx, dy);
        const gap = Math.max(0, d - rad), D = 80;
        if (!d || gap > D) return none();
        const k = Math.pow(1 - gap / D, 1.6), ux = dx / d, uy = dy / d;
        const a = (.24 * k).toFixed(3), o = 2; // gleich stark wie vorher …
        // … aber nur ein schmaler Lichtsaum am Rand (vorher breit genug, dass er auf dem iPhone den halben Knopf einfärbte)
        parts.push(`inset ${(-ux * o).toFixed(2)}px ${(-uy * o).toFixed(2)}px 3px -1px rgba(${L.rgb},${a})`);
      });
      btn.style.setProperty("--refl", parts.join(", "));
    });
  }
  $("tabs").addEventListener("scroll", reflectSoon, { passive: true });
  window.addEventListener("resize", reflectSoon);
  setTimeout(reflectSoon, 300);

  // ---------- Tab-Wechsel per Wischen auf der Strich-Box (#99) ----------
  (() => {
    const card = document.querySelector(".card"), tally = $("tally");
    let x0 = 0, y0 = 0, t0 = 0, dx = 0, mode = 0; // 0 = noch offen, 1 = seitlich, -1 = senkrecht/ignorieren
    const idx = () => state.tabs.findIndex(t => t.id === state.activeId);
    card.addEventListener("touchstart", (e) => {
      if (e.touches.length > 1 || state.tabs.length < 2 || e.target.closest("button, .undo-pill, input")) { mode = -1; return; }
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = performance.now(); dx = 0; mode = 0;
    }, { passive: true });
    card.addEventListener("touchmove", (e) => {
      if (mode === -1) return;
      const t = e.touches[0], ddx = t.clientX - x0, ddy = t.clientY - y0;
      if (mode === 0) {
        if (Math.hypot(ddx, ddy) < 10) return;
        mode = Math.abs(ddx) > Math.abs(ddy) * 1.3 ? 1 : -1;
        if (mode !== 1) return;
        tally.classList.remove("back"); tally.classList.add("dragx");
      }
      if (e.cancelable) e.preventDefault();
      dx = ddx;
      const i = idx(), edge = (dx > 0 && i === 0) || (dx < 0 && i === state.tabs.length - 1);
      const m = edge ? 26 : 70, v = m * Math.tanh(dx / (m * 2.2)); // folgt dem Finger, am Rand gummiartig
      tally.style.transform = "translate3d(" + v.toFixed(1) + "px,0,0)";
      tally.style.opacity = String(1 - Math.min(.45, Math.abs(v) / 160));
    }, { passive: false });
    const end = () => {
      if (mode !== 1) { mode = 0; return; }
      mode = 0; tally.classList.remove("dragx");
      const i = idx(), vel = dx / Math.max(1, performance.now() - t0);
      const dir = (dx < -55 || vel < -.45) ? 1 : (dx > 55 || vel > .45) ? -1 : 0, j = i + dir;
      if (!dir || j < 0 || j >= state.tabs.length) {
        tally.classList.add("back"); tally.style.transform = ""; tally.style.opacity = "";
        setTimeout(() => tally.classList.remove("back"), 460); return;
      }
      tally.style.transform = ""; tally.style.opacity = "";
      tally.style.setProperty("--sx", (dir * 34) + "px"); tally.style.setProperty("--sy", "0px");
      state.activeId = state.tabs[j].id; lastAdded = -1; swapping = true; commit(false);
      setTimeout(() => { tally.style.removeProperty("--sx"); tally.style.removeProperty("--sy"); }, 420);
    };
    card.addEventListener("touchend", end); card.addEventListener("touchcancel", end);
  })();
  // ---------- Liquid-Glass-Knöpfe ----------
  function glassPress(btn, px, py) {
    btn.classList.add("lg");
    // Feder-Zustand: Größe (sx/sy) und Versatz (ox/oy) mit Geschwindigkeit – nie ein Sprung
    const st = { sx: 1, sy: 1, ox: 0, oy: 0, vsx: 0, vsy: 0, vox: 0, voy: 0, tsx: 1, tsy: 1, tox: 0, toy: 0 };
    let on = false, cx = 0, cy = 0, w = 0, h = 0, moved = false, raf = 0, last = 0, downAt = 0, relT = 0;
    const apply = () => {
      btn.style.setProperty("transform", "translate3d(" + st.ox.toFixed(2) + "px," + st.oy.toFixed(2) + "px,0) scale(" + st.sx.toFixed(4) + "," + st.sy.toFixed(4) + ")", "important");
    };
    const tick = (now) => {
      const dt = Math.min(.032, (now - (last || now)) / 1000) || .016; last = now;
      // gedrückt: weich und ohne Überschwingen; losgelassen: ruhiges Nachfedern
      const k = on ? 230 : 200, c = on ? 27 : 15;
      const sp = (p, v, t) => { const a = k * (st[t] - st[p]) - c * st[v]; st[v] += a * dt; st[p] += st[v] * dt; };
      sp("sx", "vsx", "tsx"); sp("sy", "vsy", "tsy"); sp("ox", "vox", "tox"); sp("oy", "voy", "toy");
      apply();
      const rest = Math.abs(st.sx - st.tsx) + Math.abs(st.sy - st.tsy) + Math.abs(st.ox - st.tox) + Math.abs(st.oy - st.toy)
        + Math.abs(st.vsx) + Math.abs(st.vsy) + (Math.abs(st.vox) + Math.abs(st.voy)) / 100;
      if (rest < .0005) { Object.assign(st, { sx: st.tsx, sy: st.tsy, ox: st.tox, oy: st.toy, vsx: 0, vsy: 0, vox: 0, voy: 0 }); apply(); raf = 0; last = 0; return; }
      raf = requestAnimationFrame(tick);
    };
    const kick = () => { if (!raf) { last = 0; raf = requestAnimationFrame(tick); } };
    const glow = (e) => {
      btn.style.setProperty("--gx", ((e.clientX - (cx - w / 2)) / w * 100) + "%");
      btn.style.setProperty("--gy", ((e.clientY - (cy - h / 2)) / h * 100) + "%");
    };
    btn.addEventListener("pointerdown", (e) => {
      if (btn.disabled || btn.__noGlass) return;
      clearTimeout(relT);
      on = true; moved = false; downAt = performance.now();
      const r = btn.getBoundingClientRect();
      w = btn.offsetWidth; h = btn.offsetHeight; cx = r.left + r.width / 2; cy = r.top + r.height / 2;
      if (btn.setPointerCapture) try { btn.setPointerCapture(e.pointerId); } catch (_) {}
      btn.classList.add("pressed");
      glow(e); st.tsx = px; st.tsy = py; st.tox = 0; st.toy = 0; kick();
    });
    btn.addEventListener("pointermove", (e) => {
      if (!on) return;
      const dx = e.clientX - cx, dy = e.clientY - cy;
      if (!moved && Math.hypot(dx, dy) < 6) return; // kleines Fingerzittern ignorieren
      moved = true;
      const damp = (v, m) => m * Math.tanh(v / (m * 4));
      const kk = Math.min(w, h) / 48; // große Knöpfe dehnen sich weniger
      st.tsx = px + Math.min(.18, Math.abs(dx) / (260 * kk)); st.tsy = py + Math.min(.18, Math.abs(dy) / (260 * kk));
      st.tox = damp(dx, 10); st.toy = damp(dy, 10); kick(); // Glanz bleibt, wo der Finger aufgesetzt hat (spart Arbeit beim Ziehen)
    });
    const up = () => {
      if (!on) return; on = false;
      // kurzer Tipp: Drücken erst sichtbar fertig werden lassen, dann loslassen
      const wait = Math.max(0, 130 - (performance.now() - downAt));
      relT = setTimeout(() => { btn.classList.remove("pressed"); st.tsx = 1; st.tsy = 1; st.tox = 0; st.toy = 0; kick(); }, wait);
    };
    ["pointerup", "pointercancel", "lostpointercapture"].forEach(ev => btn.addEventListener(ev, up));
    btn.addEventListener("contextmenu", (e) => e.preventDefault());
    // Für das Verschieben: Druck-Effekt sofort lösen, Finger-Dehnung ignorieren
    btn.__glassRelease = () => { on = false; clearTimeout(relT); btn.classList.remove("pressed"); st.tsx = 1; st.tsy = 1; st.tox = 0; st.toy = 0; kick(); };
  }
  bindSubmit($("nameForm")); bindSubmit($("valueForm"));
  // Haken/X in Pop-ups: Auslösen beim Loslassen auf dem Knopf selbst. Auf dem iPhone ging der Tipp sonst verloren,
  // wenn beim Antippen die Tastatur zuging und das Pop-up darunter wegrutschte (dann kam kein „click“ am Knopf an).
  document.querySelectorAll(".form-head .icon-btn").forEach(b => {
    let r0 = null, armed = false;
    b.addEventListener("pointerdown", (e) => {
      r0 = b.getBoundingClientRect(); armed = true;
      if (e.pointerType !== "mouse") e.preventDefault(); // Eingabefeld behält den Fokus → Tastatur bleibt, nichts verrutscht
    });
    b.addEventListener("pointerup", (e) => {
      if (!armed) return; armed = false;
      const p = 24, inside = e.clientX >= r0.left - p && e.clientX <= r0.right + p && e.clientY >= r0.top - p && e.clientY <= r0.bottom + p;
      if (!inside) return;
      b.__fast = Date.now();
      b.click(); // löst onclick bzw. das Absenden des Formulars aus
    });
    b.addEventListener("pointercancel", () => { armed = false; });
    // den echten Klick danach schlucken, damit nichts doppelt passiert
    b.addEventListener("click", (e) => { if (e.isTrusted && b.__fast && Date.now() - b.__fast < 800) { e.preventDefault(); e.stopImmediatePropagation(); } }, true);
  });
  document.querySelectorAll(".gear, .more, .form-head .icon-btn").forEach(b => glassPress(b, 1.34, 1.24));
  document.querySelectorAll(".clicker, .minus").forEach(b => glassPress(b, 1.12, 1.06));
  ["undoBtn", "redoBtn"].forEach(id => glassPress(document.getElementById(id), 1.18, 1.1));
  // Seitenleiste: gleiche Glas-Drück-Animation wie alle anderen Knöpfe
  ["sideGear", "sideBack", "statBack", "sideMore"].forEach(id => glassPress(document.getElementById(id), 1.34, 1.24));
  glassPress(document.getElementById("statOpen"), 1.08, 1.06);
  glassPress(document.getElementById("sideNew"), 1.14, 1.08);
})();
</script>
</body>
